name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  axon-app-id:
    description: "Axon GitHub App ID"
    required: false
  axon-app-secret:
    description: "Axon GitHub App private key"
    required: false
outputs:
  token:
    description: "GitHub App token or workflow token"
    value: ${{ steps.apptoken.outputs.token || github.token }}
  app-slug:
    description: "GitHub App slug or workflow actor"
    value: ${{ steps.apptoken.outputs.app-slug || github.actor }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: inputs.axon-app-id != '' && inputs.axon-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.axon-app-id }}
        private-key: ${{ inputs.axon-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug || github.actor }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.apptoken.outputs.token || github.token }}@github.com/${{ github.repository }}
      shell: bash

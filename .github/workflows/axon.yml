name: axon

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  axon:
    if: |
      contains(github.event.comment.body, ' /axon') ||
      startsWith(github.event.comment.body, '/axon') ||
      contains(github.event.comment.body, ' /ax') ||
      startsWith(github.event.comment.body, '/ax') ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /axon') ||
      startsWith(github.event.comment.body, '/axon')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Run Axon
        uses: Wade-DevCode/axon/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          AXON_API_KEY: ${{ secrets.AXON_API_KEY }}
          AXON_PERMISSION: '{"bash": "deny"}'
        with:
          model: axon/claude-opus-4-5

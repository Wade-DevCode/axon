name: release-cli
run-name: "${{ (github.event_name == 'push' || inputs.publish == true) && 'release' || 'build' }} CLI ${{ inputs.version || github.ref_name }} (${{ inputs.scope || 'all' }})"

on:
  workflow_call:
    inputs:
      version:
        description: "CLI release version without the cli-v prefix"
        required: true
        type: string
      scope:
        description: "npm platform scope"
        required: false
        default: all
        type: string
      publish:
        description: "Publish npm packages and the CLI GitHub Release"
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "CLI release version without the cli-v prefix"
        required: true
        type: string
      scope:
        description: "npm platform scope"
        required: true
        default: all
        type: choice
        options:
          - windows
          - all
      publish:
        description: "Publish npm packages and the CLI GitHub Release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "cli-v*.*.*"

concurrency: release-cli-${{ inputs.version || github.ref_name }}

permissions:
  id-token: write
  contents: write

jobs:
  release:
    if: github.repository == 'Wade-DevCode/axon'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Release CLI
        env:
          AXON_VERSION: ${{ inputs.version || github.ref_name }}
          AXON_RELEASE_SCOPE: ${{ inputs.scope || 'all' }}
          AXON_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: bun ./packages/axon/script/release.ts

      - name: Upload CLI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axon-cli-${{ inputs.version || github.ref_name }}-${{ inputs.scope || 'all' }}-${{ github.sha }}
          path: packages/axon/release/*
          if-no-files-found: error

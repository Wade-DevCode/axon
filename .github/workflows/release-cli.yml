name: release-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Wade-DevCode/axon'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          AXON_VERSION: ${{ steps.version.outputs.version }}
          AXON_CHANNEL: latest
        run: bun ./packages/axon/script/build.ts

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          for directory in packages/axon/dist/axon-*; do
            name="$(basename "$directory")"
            if [[ "$name" == axon-windows-* ]]; then
              (cd "$directory" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" .)
              continue
            fi
            tar -czf "release/$name.tar.gz" -C "$directory" .
          done
          (cd release && sha256sum ./* > checksums.txt)

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            exit 0
          fi
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "Axon $tag" \
            --generate-notes

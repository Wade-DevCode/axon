name: release-cli
run-name: "release CLI ${{ inputs.version || github.ref_name }} (${{ inputs.scope || 'all' }})"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      scope:
        description: "npm platform scope"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - all
  push:
    tags:
      - "v*"

concurrency: release-cli-${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Wade-DevCode/axon'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Release CLI
        env:
          AXON_VERSION: ${{ inputs.version || github.ref_name }}
          AXON_RELEASE_SCOPE: ${{ inputs.scope || 'all' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
        run: bun ./packages/axon/script/release.ts

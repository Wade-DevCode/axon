name: build-vscode

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate tagged version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-v}"
          package_version=$(node -p "require('./sdks/vscode/package.json').version")
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Install extension dependencies
        run: bun install
        working-directory: ./sdks/vscode

      - name: Build extension
        run: bun run package
        working-directory: ./sdks/vscode

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          path="dist/axon-developer-agent-${version}.vsix"
          npx --yes @vscode/vsce@3.9.2 package --no-git-tag-version --no-update-package-json --no-dependencies --skip-license -o "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
        working-directory: ./sdks/vscode

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axon-vscode-${{ github.sha }}
          path: sdks/vscode/${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          npm install --global @vscode/vsce@3.9.2 ovsx
          ./script/publish
        working-directory: ./sdks/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

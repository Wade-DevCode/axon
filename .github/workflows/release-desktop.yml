name: release-desktop
run-name: "release desktop ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version without the v prefix"
        required: true
        type: string

concurrency: release-desktop-${{ inputs.version }}

permissions:
  id-token: write
  contents: write

jobs:
  windows-x64:
    if: github.repository == 'Wade-DevCode/axon'
    runs-on: windows-2025
    env:
      AXON_VERSION: ${{ inputs.version }}
      AXON_CHANNEL: prod
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Azure login
        if: >-
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Normalize version
        shell: pwsh
        run: |
          $version = "$env:AXON_VERSION" -replace '^v', ''
          "AXON_VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare desktop app
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build desktop app
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package desktop app
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Upload desktop installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "${{ github.workspace }}\packages\desktop\dist" -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap" -or $_.Name -like "latest*.yml" } |
            Select-Object -ExpandProperty FullName

          if (-not $files) {
            throw "No desktop release assets found"
          }

          gh release upload "v$env:AXON_VERSION" $files --clobber --repo "${{ github.repository }}"

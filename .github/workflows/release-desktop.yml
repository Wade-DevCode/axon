name: release-desktop
run-name: "release Desktop ${{ inputs.version || github.ref_name }}"

on:
  workflow_call:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: true
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE:
        required: true
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop release version without the desktop-v prefix"
        required: true
        type: string
  push:
    tags:
      - "desktop-v*.*.*"

concurrency: release-desktop-${{ inputs.version || github.ref_name }}

permissions:
  id-token: write
  contents: write

jobs:
  windows-x64:
    if: github.repository == 'Wade-DevCode/axon'
    runs-on: windows-2025
    env:
      AXON_VERSION: ${{ inputs.version || github.ref_name }}
      AXON_CHANNEL: prod
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Normalize version
        shell: pwsh
        run: |
          $version = "$env:AXON_VERSION" -replace '^(desktop-)?v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid Desktop release version: $version"
          }
          "AXON_VERSION=$version" >> $env:GITHUB_ENV

      - name: Require signing configuration
        shell: pwsh
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE",
            "AZURE_TRUSTED_SIGNING_ENDPOINT"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Stable Desktop releases require Azure Trusted Signing: $($missing -join ', ')"
          }

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare desktop app
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build desktop app
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package desktop app
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Verify installer signature
        shell: pwsh
        run: |
          $installer = Get-Item "${{ github.workspace }}\packages\desktop\dist\axon-desktop-win-x64.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Desktop installer signature is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Upload desktop installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "${{ github.workspace }}\packages\desktop\dist" -File |
            Where-Object { $_.Extension -in ".exe", ".blockmap" -or $_.Name -like "latest*.yml" } |
            Select-Object -ExpandProperty FullName

          if (-not $files) {
            throw "No desktop release assets found"
          }

          $tag = "desktop-v$env:AXON_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files `
              --target "$env:GITHUB_SHA" `
              --title "Axon Desktop v$env:AXON_VERSION" `
              --generate-notes `
              --latest `
              --repo "${{ github.repository }}"
          } else {
            gh release upload $tag $files --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload Desktop assets to $tag"
            }
            gh release edit $tag --latest --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update Desktop release $tag"
          }
